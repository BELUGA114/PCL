name: Build
on:
  push:
    branches:
      - main
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:
       matrix:
         configuration: [Debug, Release]
    outputs:
      describe: ${{ steps.describe.outputs.value }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      id: describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV
          echo "value=$describe" >> $GITHUB_OUTPUT

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Read Version
      id: version
      run: |
        version=$(sed -n 's/.*VersionBaseName As String = "\([^"]*\)".*/\1/p' "Plain Craft Launcher 2/Modules/Base/ModBase.vb")
        echo "value=$version" >> "$GITHUB_OUTPUT"

    - name: Download Release Build
      uses: actions/download-artifact@v8
      with:
        name: Release ${{ needs.build.outputs.describe }}
        path: dist

    - name: Prepare Asset
      run: |
        cd dist
        mv "Plain Craft Launcher 2.exe" "PCL-${{ steps.version.outputs.value }}-mod-build${{ github.run_number }}.exe"

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > notes.md <<'EOF'
        本构建是第三方基于 PCL ${{ steps.version.outputs.value }} 源代码独立进行的二次创作，与 PCL 官方无关。

        原作者：龙腾猫跃（Plain Craft Launcher 的开发者）
        原项目：https://github.com/Meloong-Git/PCL
        赞助原作者：https://meloong.com/afd/a/LTCat
        本修改版源代码：${{ github.server_url }}/${{ github.repository }}

        本构建不包含 2.99.0.0 的 MC 下载限制；开源版本也不含远程配置、更新通知与强制更新机制。

        - 版本：${{ steps.version.outputs.value }}
        - 提交：${{ github.sha }}
        - 构建号：${{ github.run_number }}
        - 运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EOF
        gh release create "pcl-${{ steps.version.outputs.value }}-mod-build${{ github.run_number }}" \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "PCL ${{ steps.version.outputs.value }} 第三方修改版（构建 ${{ github.run_number }}）" \
          --notes-file notes.md \
          dist/*.exe
